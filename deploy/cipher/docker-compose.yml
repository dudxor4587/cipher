# cipher 서비스 (backend + db). backend 는 internal(db용) + edge(caddy용) 두 네트워크에 붙는다.
# db 는 internal 전용(외부 비공개). 시크릿은 --env-file 로 주입.
#   docker compose --env-file ../.env.prod up -d --build
services:
  db:
    image: postgres:16
    container_name: cipher-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cipher
      POSTGRES_USER: cipher
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - cipher_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipher"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: cipher-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://cipher-db:5432/cipher
      DB_USERNAME: cipher
      DB_PASSWORD: ${DB_PASSWORD}
      CIPHER_JWT_SECRET: ${CIPHER_JWT_SECRET}
      CIPHER_AES_KEY: ${CIPHER_AES_KEY}
    expose:
      - "8080"
    # 공용 엣지 프록시(oracle-ampere/edge)가 이 라벨을 읽어 자동 라우팅 + HTTPS
    labels:
      caddy: cipher.134.185.100.62.sslip.io
      caddy.reverse_proxy: "{{upstreams 8080}}"
    networks:
      - internal
      - edge

volumes:
  cipher_pgdata:

networks:
  internal:
  edge:
    external: true
